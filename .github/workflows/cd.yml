name: CD

on:
  push:
    branches: ["main"]
  release:
    types: [created]

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Deploy to Cloudflare Workers (staging)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v2
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ./
          environment: staging

      - name: Publish with wrangler (staging)
        if: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_ZONE_ID != '' }}
        run: |
          wrangler publish --env staging --account-id ${{ secrets.CLOUDFLARE_ACCOUNT_ID }} --zone-id ${{ secrets.CLOUDFLARE_ZONE_ID }}

  deploy-production:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Deploy to Cloudflare Workers (production)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v2
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ./
          environment: production

      - name: Publish with wrangler (production)
        if: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_ZONE_ID != '' }}
        run: |
          wrangler publish --env production --account-id ${{ secrets.CLOUDFLARE_ACCOUNT_ID }} --zone-id ${{ secrets.CLOUDFLARE_ZONE_ID }}
