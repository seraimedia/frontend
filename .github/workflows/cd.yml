name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: string

jobs:
  deploy:
    # Only allow manual runs from main to proceed
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Install dependencies (prefer npm lock)
        run: |
          # prefer per-app installs if present
          if [ -f ./apps/backend/package.json ]; then
            (cd apps/backend && npm ci)
          fi
          if [ -f ./apps/frontend/package.json ]; then
            (cd apps/frontend && npm ci)
          fi

      - name: Build
        run: |
          if [ -f ./apps/frontend/package.json ]; then
            (cd apps/frontend && npm run build --if-present)
          fi
          if [ -f ./apps/backend/package.json ]; then
            (cd apps/backend && npm run build --if-present || true)
          fi

      - name: Deploy to Cloudflare Workers via action
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v2
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ./apps/backend
          environment: ${{ github.event.inputs.environment }}
          command: publish --env ${{ github.event.inputs.environment }}

      - name: Fallback: Publish with wrangler CLI
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if command -v wrangler >/dev/null 2>&1; then
            (cd apps/backend && wrangler publish --env ${{ github.event.inputs.environment }})
          else
            echo "wrangler not present; skipping fallback"
          fi
